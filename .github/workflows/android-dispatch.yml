name: Trigger Android Release (manual)

# The android build is normally fired by the release workflow on a tag push. When that
# leg fails — an expired ANDROID_REPO_TOKEN has done it repeatedly — rerunning the
# whole release just to retry one dispatch rebuilds 16 binaries for nothing. This does
# only the dispatch, and doubles as a way to verify the token without cutting a tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build (e.g. v0.5.18)'
        required: true
        type: string

jobs:
  dispatch:
    name: Dispatch to pepebot-android
    runs-on: ubuntu-latest
    environment: ANDROID
    env:
      ANDROID_REPO_TOKEN: ${{ secrets.ANDROID_REPO_TOKEN || vars.ANDROID_REPO_TOKEN }}

    steps:
      # Dispatch directly rather than guessing at permissions first: for a
      # fine-grained PAT, .permissions.push reflects the *user's* role on the repo,
      # not what the token was granted, so a preflight can pass and the dispatch
      # still fail. One call, and a message that names the fix.
      - name: Trigger pepebot-android release
        env:
          GH_TOKEN: ${{ env.ANDROID_REPO_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ANDROID_REPO_TOKEN is empty. Set it in the ANDROID environment."
            exit 1
          fi

          if gh api repos/pepebot-space/pepebot-android/dispatches -X POST \
              -f event_type=pepebot-release \
              -f "client_payload[version]=$VERSION"
          then
            echo "Dispatched pepebot-release for $VERSION"
            exit 0
          fi

          echo "::error::Dispatch to pepebot-space/pepebot-android was refused. repository_dispatch is a write, so the token needs write access to that repository: a classic PAT with the 'repo' scope, or a fine-grained PAT whose resource owner is the pepebot-space organisation (it defaults to your personal account) with Repository permissions > Contents set to 'Read and write'."
          exit 1
