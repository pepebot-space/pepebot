name: Trigger Android Release (manual)

# The android build is normally fired by the release workflow on a tag push. When that
# leg fails — an expired ANDROID_REPO_TOKEN has done it repeatedly — rerunning the
# whole release just to retry one dispatch rebuilds 16 binaries for nothing. This does
# only the dispatch, and doubles as a way to verify the token without cutting a tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build (e.g. v0.5.18)'
        required: true
        type: string

jobs:
  dispatch:
    name: Dispatch to pepebot-android
    runs-on: ubuntu-latest
    environment: ANDROID
    env:
      ANDROID_REPO_TOKEN: ${{ secrets.ANDROID_REPO_TOKEN || vars.ANDROID_REPO_TOKEN }}

    steps:
      - name: Check the token can reach the Android repo
        env:
          GH_TOKEN: ${{ env.ANDROID_REPO_TOKEN }}
        run: |
          if [ -z "$ANDROID_REPO_TOKEN" ]; then
            echo "::error::ANDROID_REPO_TOKEN is empty. Set it in the ANDROID environment."
            exit 1
          fi
          if ! gh api repos/pepebot-space/pepebot-android >/dev/null 2>&1; then
            echo "::error::ANDROID_REPO_TOKEN cannot see pepebot-space/pepebot-android. For a fine-grained PAT, set its resource owner to the pepebot-space organisation (it defaults to your personal account) and grant access to that repository. For a classic PAT, use the 'repo' scope."
            exit 1
          fi
          # Read access is not enough: repository_dispatch is a write. Checking the
          # reported push permission catches a read-only token here, instead of at
          # dispatch time where the only clue is "Resource not accessible".
          if [ "$(gh api repos/pepebot-space/pepebot-android --jq '.permissions.push // false')" != "true" ]; then
            echo "::error::ANDROID_REPO_TOKEN can read pepebot-android but not write to it, and repository_dispatch needs write. Fine-grained PAT: set Repository permissions > Contents to 'Read and write'. Classic PAT: use the 'repo' scope."
            exit 1
          fi
          echo "Token can dispatch to pepebot-space/pepebot-android."

      - name: Trigger pepebot-android release
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ env.ANDROID_REPO_TOKEN }}
          repository: pepebot-space/pepebot-android
          event-type: pepebot-release
          client-payload: '{"version": "${{ inputs.version }}"}'

      - name: Done
        run: echo "Dispatched pepebot-release for ${{ inputs.version }}"
