<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pepebot Live API (OpenAI Realtime)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-4">
  <div class="max-w-2xl mx-auto">
    <div class="rounded-2xl border border-slate-800 bg-slate-900 shadow-2xl overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
        <div>
          <h1 class="text-xl font-semibold">Pepebot OpenAI Realtime Demo</h1>
          <p class="text-xs text-slate-400">Works with any OpenAI-Realtime-compatible endpoint proxied by Pepebot</p>
        </div>
        <div id="status" class="text-xs px-2 py-1 rounded-full bg-slate-800 text-slate-300">Disconnected</div>
      </div>

      <div class="p-5 space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <label class="text-xs text-slate-400 md:col-span-2">Pepebot gateway
            <input id="gatewayInput" class="mt-1 w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 text-sm text-slate-100" />
          </label>
          <label class="text-xs text-slate-400">Provider
            <input id="providerInput" value="realtime" class="mt-1 w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 text-sm text-slate-100" />
          </label>
          <label class="text-xs text-slate-400">Model
            <input id="modelInput" value="google/gemma-4-31B-it" class="mt-1 w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 text-sm text-slate-100" />
          </label>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <button id="connectBtn" class="py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 transition">Connect</button>
          <button id="disconnectBtn" class="py-2.5 rounded-lg bg-rose-700 hover:bg-rose-600 transition">Disconnect</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <button id="startMicBtn" class="py-2.5 rounded-lg bg-blue-700 hover:bg-blue-600 transition">Start Mic</button>
          <button id="stopMicBtn" class="py-2.5 rounded-lg bg-slate-700 hover:bg-slate-600 transition">Stop Mic</button>
        </div>

        <button id="testAudioBtn" class="w-full py-2.5 rounded-lg bg-violet-700 hover:bg-violet-600 transition">Send 2s test audio (no mic needed)</button>

        <div class="flex gap-2">
          <input id="textInput" class="flex-1 rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 text-sm" placeholder="Type message..." />
          <button id="sendBtn" class="rounded-lg px-4 bg-indigo-700 hover:bg-indigo-600">Send</button>
        </div>

        <div id="logs" class="h-72 overflow-y-auto rounded-lg bg-black/40 border border-slate-800 p-3 font-mono text-xs text-slate-300"></div>
      </div>
    </div>
  </div>

  <script>
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const startMicBtn = document.getElementById('startMicBtn');
    const stopMicBtn = document.getElementById('stopMicBtn');
    const sendBtn = document.getElementById('sendBtn');
    const testAudioBtn = document.getElementById('testAudioBtn');
    const gatewayInput = document.getElementById('gatewayInput');
    const providerInput = document.getElementById('providerInput');
    const modelInput = document.getElementById('modelInput');
    const textInput = document.getElementById('textInput');
    const logs = document.getElementById('logs');
    const statusEl = document.getElementById('status');

    let ws = null;
    let playbackCtx = null;
    let captureCtx = null;
    let micStream = null;
    let micSource = null;
    let micProcessor = null;
    let nextPlayTime = 0;
    let sessionReady = false;

    const INPUT_SAMPLE_RATE = 24000;
    const OUTPUT_SAMPLE_RATE = 24000;
    const SESSION_STORAGE_KEY = 'pepebot_openai_live_session_key';

    function getOrCreateClientSessionKey() {
      let key = localStorage.getItem(SESSION_STORAGE_KEY);
      if (!key) {
        key = `web-openai-live:${Date.now()}`;
        localStorage.setItem(SESSION_STORAGE_KEY, key);
      }
      return key;
    }

    // This page is often served from a different port than the gateway (or from
    // file://), so the gateway URL is explicit rather than derived from location.
    function defaultGatewayURL() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const host = location.hostname || '127.0.0.1';
      return `${proto}//${host}:18790/v1/live`;
    }

    function log(msg, type = 'info') {
      const time = new Date().toLocaleTimeString([], { hour12: false });
      const row = document.createElement('div');
      const color = type === 'error' ? 'text-rose-400' : type === 'ok' ? 'text-emerald-400' : 'text-slate-300';
      row.className = color;
      row.textContent = `[${time}] ${msg}`;
      logs.appendChild(row);
      logs.scrollTop = logs.scrollHeight;
    }

    function setStatus(value) {
      statusEl.textContent = value;
      if (value === 'Connected') {
        statusEl.className = 'text-xs px-2 py-1 rounded-full bg-emerald-900/60 text-emerald-300';
      } else if (value === 'Connecting') {
        statusEl.className = 'text-xs px-2 py-1 rounded-full bg-amber-900/60 text-amber-300';
      } else {
        statusEl.className = 'text-xs px-2 py-1 rounded-full bg-slate-800 text-slate-300';
      }
    }

    async function ensurePlaybackContext() {
      if (!playbackCtx) {
        playbackCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: OUTPUT_SAMPLE_RATE });
        log(`Playback context: ${playbackCtx.sampleRate}Hz`, 'ok');
      }
      if (playbackCtx.state === 'suspended') await playbackCtx.resume();
    }

    function pcm16ToFloat32(pcm16) {
      const f = new Float32Array(pcm16.length);
      for (let i = 0; i < pcm16.length; i++) f[i] = pcm16[i] / 32768;
      return f;
    }

    function decodeBase64Audio(base64String) {
      let s = (base64String || '').replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4 !== 0) s += '=';
      const bin = atob(s);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes.buffer;
    }

    function playPCMBuffer(arrayBuffer) {
      if (!playbackCtx) return;
      const len = arrayBuffer.byteLength || 0;
      if (len < 2 || len % 2 !== 0) return;

      const pcm16 = new Int16Array(arrayBuffer);
      if (!pcm16.length) return;

      const f32 = pcm16ToFloat32(pcm16);
      const buffer = playbackCtx.createBuffer(1, f32.length, OUTPUT_SAMPLE_RATE);
      buffer.getChannelData(0).set(f32);

      const src = playbackCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(playbackCtx.destination);

      const now = playbackCtx.currentTime;
      if (nextPlayTime < now) nextPlayTime = now;
      src.start(nextPlayTime);
      nextPlayTime += buffer.duration;
    }

    function sendEvent(payload) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify(payload));
    }

    function sendText() {
      const text = textInput.value.trim();
      if (!text || !sessionReady) return;

      sendEvent({
        type: 'conversation.item.create',
        item: {
          type: 'message',
          role: 'user',
          content: [{ type: 'input_text', text }],
        },
      });
      sendEvent({ type: 'response.create' });

      log(`You: ${text}`);
      textInput.value = '';
    }

    function handleRealtimeEvent(evt) {
      const t = evt.type;
      if (!t) return;

      if (t === 'session.created') {
        sendEvent({
          type: 'session.update',
          session: {
            modalities: ['text', 'audio'],
            instructions: 'Sapa dengan bahasa indonesia.',
            input_audio_format: 'pcm16',
            output_audio_format: 'pcm16',
            turn_detection: { type: 'server_vad' },
            voice: 'alloy',
          },
        });
        sessionReady = true;
        setStatus('Connected');
        log('Realtime session created', 'ok');
        return;
      }

      if (t === 'response.audio.delta' && evt.delta) {
        playPCMBuffer(decodeBase64Audio(evt.delta));
        return;
      }

      if (t === 'response.audio_transcript.delta' && evt.delta) {
        log(`Bot(transcript): ${evt.delta}`);
        return;
      }

      if (t === 'response.text.delta' && evt.delta) {
        log(`Bot(text): ${evt.delta}`);
        return;
      }

      if (t === 'error') {
        const msg = evt.error?.message || 'unknown error';
        log(`Realtime error: ${msg}`, 'error');
      }
    }

    function tryParseTextFrame(str) {
      try {
        const data = JSON.parse(str);

        if (data.status === 'connected') {
          setStatus('Connecting');
          log(`Proxy connected: ${data.provider} -> ${data.model} (${data.session || 'no-session'})`, 'ok');
          return;
        }

        if (data.error && !data.type) {
          log(`Error: ${typeof data.error === 'string' ? data.error : JSON.stringify(data.error)}`, 'error');
          return;
        }

        handleRealtimeEvent(data);
      } catch (_) {
        // ignore
      }
    }

    async function connect() {
      if (ws && ws.readyState === WebSocket.OPEN) return;

      setStatus('Connecting');
      // Don't await audio setup here: AudioContext.resume() never resolves until the
      // browser sees a user gesture, which would block the WebSocket from ever opening.
      // Line 303 sets it up on the first audio chunk instead.
      ensurePlaybackContext().catch((err) => log(`Playback setup: ${err}`, 'error'));

      const url = gatewayInput.value.trim() || defaultGatewayURL();
      log(`Connecting to ${url}`);
      ws = new WebSocket(url);
      ws.binaryType = 'arraybuffer';
      sessionReady = false;

      ws.onopen = () => {
        log('WebSocket open, sending setup', 'ok');
        sendEvent({
          setup: {
            provider: providerInput.value.trim() || 'realtime',
            model: modelInput.value.trim() || 'google/gemma-4-31B-it',
            agent: 'default',
            session_key: getOrCreateClientSessionKey(),
            enable_tools: true,
          },
        });
      };

      ws.onmessage = async (event) => {
        if (event.data instanceof ArrayBuffer) {
          return;
        }
        const txt = typeof event.data === 'string' ? event.data : await event.data.text();
        tryParseTextFrame(txt);
      };

      ws.onerror = () => {
        setStatus('Disconnected');
        log('WebSocket error', 'error');
      };

      ws.onclose = () => {
        setStatus('Disconnected');
        sessionReady = false;
        log('WebSocket closed');
      };
    }

    async function startMic() {
      if (!sessionReady) {
        log('Connect first (wait session.created)', 'error');
        return;
      }

      await ensurePlaybackContext();

      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          sampleRate: INPUT_SAMPLE_RATE,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        },
      });

      captureCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: INPUT_SAMPLE_RATE });
      if (captureCtx.state === 'suspended') await captureCtx.resume();

      audioTail = new Float32Array(0);
      micSource = captureCtx.createMediaStreamSource(micStream);
      micProcessor = captureCtx.createScriptProcessor(4096, 1, 1);

      micProcessor.onaudioprocess = (e) => {
        if (!sessionReady) return;

        const input = e.inputBuffer.getChannelData(0);
        sendAudioSamples(input);
      };

      micSource.connect(micProcessor);
      micProcessor.connect(captureCtx.destination);
      log('Mic started', 'ok');
    }

    function pcm16Base64(samples) {
      const pcm16 = new Int16Array(samples.length);
      for (let i = 0; i < samples.length; i++) {
        const v = Math.max(-1, Math.min(1, samples[i]));
        pcm16[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
      }
      const bytes = new Uint8Array(pcm16.buffer);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    // Realtime servers with a frame-based VAD (webrtcvad, Silero) only accept exact
    // 20ms frames and silently stall the turn on anything else — no speech_stopped,
    // no transcription, no response. The mic hands us 4096-sample buffers, so every
    // audio path repacketizes to BLOCK_SAMPLES before sending.
    const BLOCK_SAMPLES = INPUT_SAMPLE_RATE / 50; // 20ms
    let audioTail = new Float32Array(0);

    function sendAudioSamples(samples) {
      let buf = samples;
      if (audioTail.length) {
        buf = new Float32Array(audioTail.length + samples.length);
        buf.set(audioTail);
        buf.set(samples, audioTail.length);
      }
      let offset = 0;
      for (; offset + BLOCK_SAMPLES <= buf.length; offset += BLOCK_SAMPLES) {
        sendEvent({
          type: 'input_audio_buffer.append',
          audio: pcm16Base64(buf.subarray(offset, offset + BLOCK_SAMPLES)),
        });
      }
      audioTail = buf.slice(offset);
    }

    // Builds 20ms base64 pcm16 frames: `toneSec` of a 440Hz tone, then `silenceSec`
    // of silence so a server-side VAD has a clear end-of-speech to trigger on.
    function buildTestAudioChunks(toneSec = 2, silenceSec = 2, freq = 440) {
      const chunks = [];
      let phase = 0;
      const framesPerSec = INPUT_SAMPLE_RATE / BLOCK_SAMPLES;
      const toneFrames = Math.round(toneSec * framesPerSec);
      const totalFrames = toneFrames + Math.round(silenceSec * framesPerSec);
      for (let c = 0; c < totalFrames; c++) {
        const samples = new Float32Array(BLOCK_SAMPLES);
        if (c < toneFrames) {
          for (let i = 0; i < BLOCK_SAMPLES; i++) {
            samples[i] = Math.sin(phase) * 0.3;
            phase += (2 * Math.PI * freq) / INPUT_SAMPLE_RATE;
          }
        }
        chunks.push(pcm16Base64(samples));
      }
      return chunks;
    }

    // Streams the synthetic chunks in real time, exactly like the mic path, so you can
    // exercise browser -> Pepebot -> upstream without granting microphone access.
    // Keep this tab in the foreground: browsers throttle timers in background tabs.
    async function sendTestAudio() {
      if (!sessionReady) {
        log('Connect first (wait session.created)', 'error');
        return;
      }
      testAudioBtn.disabled = true;
      const chunks = buildTestAudioChunks();
      log(`Test audio: streaming ${chunks.length} frames of 20ms (2s tone + 2s silence)...`);

      for (const audio of chunks) {
        sendEvent({ type: 'input_audio_buffer.append', audio });
        await new Promise((r) => setTimeout(r, 20));
      }

      sendEvent({ type: 'input_audio_buffer.commit' });
      sendEvent({ type: 'response.create' });
      log(`Test audio sent (${chunks.length} frames), committed`, 'ok');
      testAudioBtn.disabled = false;
    }

    function stopMic() {
      if (micProcessor) {
        micProcessor.disconnect();
        micProcessor = null;
      }
      if (micSource) {
        micSource.disconnect();
        micSource = null;
      }
      if (micStream) {
        micStream.getTracks().forEach((t) => t.stop());
        micStream = null;
      }
      if (captureCtx && captureCtx.state !== 'closed') {
        captureCtx.close();
      }
      captureCtx = null;

      if (sessionReady) {
        sendEvent({ type: 'input_audio_buffer.commit' });
        sendEvent({ type: 'response.create' });
      }

      log('Mic stopped');
    }

    function disconnect() {
      stopMic();
      if (ws) {
        ws.close();
        ws = null;
      }
      setStatus('Disconnected');
    }

    connectBtn.addEventListener('click', connect);
    disconnectBtn.addEventListener('click', disconnect);
    startMicBtn.addEventListener('click', startMic);
    stopMicBtn.addEventListener('click', stopMic);
    testAudioBtn.addEventListener('click', sendTestAudio);
    sendBtn.addEventListener('click', sendText);
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendText();
    });

    gatewayInput.value = defaultGatewayURL();
    log('Ready. Set gateway/provider/model above, then Connect.');
  </script>
</body>
</html>
